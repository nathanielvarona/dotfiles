# GlazeWM configuration
# Active Windows tiling manager. Keep in sync with docs/tiling-manager/.
# Alt is the main modifier because Windows reserves many Super shortcuts.
general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: "monitor_focus"
  hide_method: "cloak"
  show_all_in_taskbar: false

# Inner and outer gaps between windows and screen edges.
gaps:
  scale_with_dpi: true
  inner_gap: "5px"
  outer_gap:
    top: "10px"
    right: "10px"
    bottom: "10px"
    left: "10px"

# Borders and visual effects for focused and unfocused windows.
window_effects:
  focused_window:
    border:
      enabled: true
      color: "#33ccff"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: "square"
    transparency:
      enabled: false
      opacity: "95%"
  other_windows:
    border:
      enabled: true
      color: "#595959"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: "square"
    transparency:
      enabled: false
      opacity: "0%"

# New windows tile by default; floating windows open centered.
window_behavior:
  initial_state: "tiling"
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# Ten named workspaces, switched with Alt+1 through Alt+0.
workspaces:
  - name: "1"
  - name: "2"
  - name: "3"
  - name: "4"
  - name: "5"
  - name: "6"
  - name: "7"
  - name: "8"
  - name: "9"
  - name: "10"

# Windows GlazeWM should ignore, such as status bars, overlays, and dialogs.
window_rules:
  - commands: ["ignore"]
    match:
      - window_process: { equals: "zebar" }
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }
      - window_process: { equals: "PowerToys" }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: "Command Palette" }
        window_class: { equals: "WinUIDesktopWin32WindowClass" }
      - window_process: { equals: "PowerToys" }
        window_title: { regex: ".*? - Peek" }
      - window_process: { equals: "Lively" }
        window_class: { regex: "HwndWrapper" }
      - window_process: { equals: "EXCEL" }
        window_class: { not_regex: "XLMAIN" }
      - window_process: { equals: "WINWORD" }
        window_class: { not_regex: "OpusApp" }
      - window_process: { equals: "POWERPNT" }
        window_class: { not_regex: "PPTFrameClass" }
      - window_process: { equals: "yasb" }
      - window_process: { equals: "YASB" }

# Resize mode: enter with Alt+R, adjust with H/J/K/L, exit with Esc or Enter.
binding_modes:
  - name: "resize"
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["h", "left"]
      - commands: ["resize --width +2%"]
        bindings: ["l", "right"]
      - commands: ["resize --height +2%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -2%"]
        bindings: ["j", "down"]
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter"]

# Focus windows with Alt + H/J/K/L or the arrow keys.
keybindings:
  - commands: ["focus --direction left"]
    bindings: ["alt+h", "alt+left"]
  - commands: ["focus --direction right"]
    bindings: ["alt+l", "alt+right"]
  - commands: ["focus --direction up"]
    bindings: ["alt+k", "alt+up"]
  - commands: ["focus --direction down"]
    bindings: ["alt+j", "alt+down"]

  # Move the focused window with Alt+Shift + H/J/K/L or the arrow keys.
  - commands: ["move --direction left"]
    bindings: ["alt+shift+h", "alt+shift+left"]
  - commands: ["move --direction right"]
    bindings: ["alt+shift+l", "alt+shift+right"]
  - commands: ["move --direction up"]
    bindings: ["alt+shift+k", "alt+shift+up"]
  - commands: ["move --direction down"]
    bindings: ["alt+shift+j", "alt+shift+down"]

  # Resize directly with Alt + U/P/O/I (or the minus/plus keys with Shift).
  - commands: ["resize --width -2%"]
    bindings: ["alt+u", "alt+oem_minus"]
  - commands: ["resize --width +2%"]
    bindings: ["alt+p", "alt+oem_plus"]
  - commands: ["resize --height +2%"]
    bindings: ["alt+o", "alt+shift+oem_minus"]
  - commands: ["resize --height -2%"]
    bindings: ["alt+i", "alt+shift+oem_plus"]

  # Enter resize mode for repeated H/J/K/L adjustments.
  - commands: ["wm-enable-binding-mode --name resize"]
    bindings: ["alt+r"]

  # Window state: floating, tiling, fullscreen, minimized, close, and direction.
  - commands: ["toggle-floating --centered"]
    bindings: ["alt+shift+space", "alt+t"]
  - commands: ["toggle-tiling"]
    bindings: ["alt+shift+t"]
  - commands: ["toggle-fullscreen"]
    bindings: ["alt+f"]
  - commands: ["toggle-minimized"]
    bindings: ["alt+m"]
  - commands: ["close"]
    bindings: ["alt+q", "alt+w", "alt+shift+q"]
  - commands: ["set-floating --centered"]
    bindings: ["alt+o"]
  - commands: ["toggle-tiling-direction"]
    bindings: ["alt+v", "alt+j"]

  # Session control: pause, reload, redraw, and exit GlazeWM.
  - commands: ["wm-toggle-pause"]
    bindings: ["alt+shift+p"]
  - commands: ["wm-reload-config"]
    bindings: ["alt+shift+r"]
  - commands: ["wm-redraw"]
    bindings: ["alt+shift+w"]
  - commands: ["wm-exit"]
    bindings: ["alt+shift+e"]

  # Launch common applications and terminals.
  - commands: ["shell-exec alacritty"]
    bindings: ["alt+enter"]
  - commands: ["shell-exec chrome"]
    bindings: ["alt+shift+b", "alt+shift+return"]
  - commands: ["shell-exec explorer"]
    bindings: ["alt+shift+f"]
  - commands: ["shell-exec code"]
    bindings: ["alt+shift+n"]
  - commands: ["shell-exec calc"]
    bindings: ["alt+shift+q"]
  - commands: ["shell-exec alacritty -e psmux"]
    bindings: ["alt+ctrl+return"]

  # Switch directly to workspace 1-9 with Alt+1..9 and workspace 10 with Alt+0.
  - commands: ["focus --workspace 1"]
    bindings: ["alt+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["alt+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["alt+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["alt+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["alt+5"]
  - commands: ["focus --workspace 6"]
    bindings: ["alt+6"]
  - commands: ["focus --workspace 7"]
    bindings: ["alt+7"]
  - commands: ["focus --workspace 8"]
    bindings: ["alt+8"]
  - commands: ["focus --workspace 9"]
    bindings: ["alt+9"]
  - commands: ["focus --workspace 10"]
    bindings: ["alt+0"]

  # Move the focused window to a workspace and follow it there.
  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["alt+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["alt+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["alt+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["alt+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["alt+shift+5"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["alt+shift+6"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["alt+shift+7"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["alt+shift+8"]
  - commands: ["move --workspace 9", "focus --workspace 9"]
    bindings: ["alt+shift+9"]
  - commands: ["move --workspace 10", "focus --workspace 10"]
    bindings: ["alt+shift+0"]

  # Jump between active and recent workspaces.
  - commands: ["focus --next-active-workspace"]
    bindings: ["alt+s"]
  - commands: ["focus --prev-active-workspace"]
    bindings: ["alt+a"]
  - commands: ["focus --recent-workspace"]
    bindings: ["alt+d"]

  # Move an entire workspace between monitors.
  - commands: ["move-workspace --direction left"]
    bindings: ["alt+shift+a"]
  - commands: ["move-workspace --direction right"]
    bindings: ["alt+shift+f"]
  - commands: ["move-workspace --direction up"]
    bindings: ["alt+shift+d"]
  - commands: ["move-workspace --direction down"]
    bindings: ["alt+shift+s"]

  # Windows settings, lock screen, and clipboard shortcuts.
  - commands: ["shell-exec rundll32.exe user32.dll,LockWorkStation"]
    bindings: ["alt+ctrl+l"]
  - commands: ["shell-exec explorer.exe ms-settings:sound"]
    bindings: ["alt+ctrl+a"]
  - commands: ["shell-exec explorer.exe ms-settings:bluetooth"]
    bindings: ["alt+ctrl+b"]
  - commands: ["shell-exec explorer.exe ms-settings:display"]
    bindings: ["alt+ctrl+d"]
  - commands: ["shell-exec explorer.exe ms-settings:network"]
    bindings: ["alt+ctrl+n"]
  - commands: ["shell-exec explorer.exe ms-settings:powersleep"]
    bindings: ["alt+ctrl+p"]
  - commands: ["shell-exec explorer.exe ms-settings:clipboard"]
    bindings: ["alt+ctrl+v"]

  # Capture a screenshot directly to the clipboard.
  - commands: ["shell-exec snippingtool /clip"]
    bindings: ["print_screen"]
