# =============================================================================
# Terminal
# =============================================================================

set-option -ga terminal-overrides ",xterm-256color:Tc"

# =============================================================================
# General
# =============================================================================

set -g mouse on
set -g visual-activity off
set -g allow-predictions on
set -gq allow-passthrough on

# Keep window names static.
set -g automatic-rename off
setw -g automatic-rename off
set -g allow-rename off

# =============================================================================
# Prefix
# =============================================================================

set -g prefix C-Space
bind C-Space send-prefix

unbind r
bind r source-file ~/.config/psmux/psmux.conf \; display "PSMUX Configuration Reloaded!"

# =============================================================================
# Window / Pane Numbering
# =============================================================================

set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# =============================================================================
# Pane Management
# =============================================================================

bind | split-window -h
bind - split-window -v

bind -r m resize-pane -Z

# =============================================================================
# Copy Mode
# =============================================================================

set -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# =============================================================================
# Status Bar
# =============================================================================

set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# =============================================================================
# Plugins
# =============================================================================

set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'

# =============================================================================
# Theme
# =============================================================================

# Custom Colors
set -g status-style "bg=#0C0C0C"

# Status
set -g status-left "#{?client_prefix,#[bg=#0C0C0C,fg=#94e2d5,bold]  #S ,#[bg=#0C0C0C,fg=#7f849c]  #S }#[bg=#0C0C0C,fg=#6c7086]│"
set -g status-right "#[bg=#0C0C0C,fg=#7f849c] 󰭦 %Y-%m-%d 󰅐 %H:%M/%I:%M %p "

# Window Status
set -g window-status-format " #I #W "
set -g window-status-style "bg=#0C0C0C,fg=#585b70"

set -g window-status-current-format " #I #W "
set -g window-status-current-style "bg=#0C0C0C,fg=#a6adc8,bold"

set -g window-status-separator "#[bg=#0C0C0C,fg=#6c7086]│"

# =============================================================================
# Initialize PPM
# =============================================================================

run '~/.psmux/plugins/ppm/ppm.ps1'
